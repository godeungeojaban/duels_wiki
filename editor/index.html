<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Duels Wiki Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="app">
  <header class="appbar">
    <button id="sidebarToggle" class="icon-btn mobile-only" aria-label="문서 목록">☰</button>
    <a class="brand" href="#/">Duels Wiki</a>
    <span class="version">Editor 3.25</span>
    <div class="spacer"></div>
    <button id="settingsBtn" class="ghost-btn">GitHub 설정</button>
  </header>

  <section id="ribbon" class="ribbon hidden" aria-label="편집 리본">
    <div class="ribbon-tabs" role="tablist">
      <button class="ribbon-tab active" data-ribbon-tab="home">홈</button>
      <button class="ribbon-tab" data-ribbon-tab="insert">삽입</button>
      <button id="pictureTabBtn" class="ribbon-tab contextual picture-context hidden" data-ribbon-tab="picture">그림</button>
    </div>

    <div class="ribbon-panels">
      <div class="ribbon-panel active" data-ribbon-panel="home">
        <div class="ribbon-group compact-group">
          <div class="ribbon-buttons two-row">
            <button data-cmd="undo" title="실행 취소">↶</button>
            <button data-cmd="redo" title="다시 실행">↷</button>
            <button id="clearFormatBtn" title="모든 직접 서식 지우기">서식 지우기</button>
          </div>
          <span class="ribbon-group-title">편집</span>
        </div>

        <div class="ribbon-group">
          <div class="ribbon-buttons wrap-buttons">
            <button data-cmd="bold" title="굵게"><b>B</b></button>
            <button data-cmd="italic" title="기울임"><i>I</i></button>
            <button data-cmd="underline" title="밑줄"><u>U</u></button>
            <button data-cmd="strikeThrough" title="취소선"><s>S</s></button>
            <button data-cmd="subscript" title="아래 첨자">X₂</button>
            <button data-cmd="superscript" title="위 첨자">X²</button>
            <label class="ribbon-field">크기 <input id="fontSizeInput" type="number" min="8" max="96" value="16"></label>
            <label class="color-tool" title="글자색"><span>A</span><input id="textColor" type="color" value="#202124"></label>
            <label class="color-tool highlight-tool" title="텍스트 강조색"><span>형광</span><input id="highlightColor" type="color" value="#fff59d"></label>
          </div>
          <span class="ribbon-group-title">글자</span>
        </div>

        <div class="ribbon-group">
          <div class="ribbon-buttons wrap-buttons">
            <button data-cmd="insertUnorderedList" title="글머리 기호">• 목록</button>
            <button data-cmd="insertOrderedList" title="번호 매기기">1. 목록</button>
            <button data-cmd="outdent" title="내어쓰기">⇤</button>
            <button data-cmd="indent" title="들여쓰기">⇥</button>
            <button data-align="left" title="왼쪽 정렬">≡←</button>
            <button data-align="center" title="가운데 정렬">≡↔</button>
            <button data-align="right" title="오른쪽 정렬">→≡</button>
            <button data-align="justify" title="양쪽 맞춤">☰</button>
            <label class="ribbon-field">줄 간격
              <select id="lineHeightSelect">
                <option value="1">1.0</option><option value="1.15">1.15</option><option value="1.5" selected>1.5</option><option value="2">2.0</option>
              </select>
            </label>
            <label class="ribbon-field">문단 뒤 <input id="paragraphSpacingInput" type="number" min="0" max="80" value="6">px</label>
          </div>
          <span class="ribbon-group-title">단락</span>
        </div>

        <div class="ribbon-group compact-group">
          <div class="ribbon-buttons two-row">
            <button id="internalLinkBtn">내부 링크</button>
            <button id="unlinkBtn">링크 해제</button>
          </div>
          <span class="ribbon-group-title">링크</span>
        </div>
      </div>

      <div class="ribbon-panel" data-ribbon-panel="insert">
        <div class="ribbon-group">
          <div class="ribbon-buttons big-buttons">
            <button id="imageUrlBtn" class="big-tool"><span class="big-icon">🖼</span><span>그림 링크</span></button>
            <button id="imageUploadBtn" class="big-tool"><span class="big-icon">↑</span><span>그림 업로드</span></button>
            <input id="imageFile" type="file" accept="image/png,image/jpeg" hidden>
            <button id="characterCardBtn" class="big-tool"><span class="big-icon">◇</span><span>캐릭터 카드</span></button>
            <button id="descriptionBoxBtn" class="big-tool"><span class="big-icon">▤</span><span>설명 상자</span></button>
            <button id="insertLinkBtn" class="big-tool"><span class="big-icon">🔗</span><span>내부 링크</span></button>
          </div>
          <span class="ribbon-group-title">삽입</span>
        </div>
      </div>

      <div class="ribbon-panel" data-ribbon-panel="picture">
        <div class="ribbon-group">
          <div class="ribbon-buttons wrap-buttons">
            <button id="pictureResetBtn">원본 비율</button>
            <button id="pictureAltBtn">대체 텍스트</button>
            <label class="color-tool" title="그림 테두리 색"><span>선</span><input id="pictureBorderColor" type="color" value="#000000"></label>
            <label class="ribbon-field">선 <input id="pictureBorderWidth" type="number" min="0" max="20" value="0">px</label>
          </div>
          <span class="ribbon-group-title">조정</span>
        </div>
        <div class="ribbon-group">
          <div class="ribbon-buttons wrap-buttons">
            <button data-image-align="left">왼쪽</button>
            <button data-image-align="center">가운데</button>
            <button data-image-align="right">오른쪽</button>
            <label class="ribbon-field">텍스트 배치
              <select id="imageWrapSelect">
                <option value="block">위아래</option>
                <option value="inline">텍스트 줄 안</option>
                <option value="float-left">사각형-왼쪽</option>
                <option value="float-right">사각형-오른쪽</option>
              </select>
            </label>
          </div>
          <span class="ribbon-group-title">정렬</span>
        </div>
        <div class="ribbon-group">
          <div class="ribbon-buttons wrap-buttons">
            <button id="rotateLeftBtn">↶ 90°</button><button id="rotateRightBtn">↷ 90°</button>
            <label class="ribbon-field">너비 <input id="imageWidth" type="number" min="20" max="6000">px</label>
            <label class="ribbon-field">높이 <input id="imageHeight" type="number" min="20" max="6000">px</label>
            <label class="ribbon-field">회전 <input id="imageRotation" type="number" min="-360" max="360">°</label>
            <button id="imageFitBtn">문서 너비 맞춤</button>
          </div>
          <span class="ribbon-group-title">크기</span>
        </div>
      </div>
    </div>
  </section>

  <div class="workspace">
    <aside id="sidebar" class="sidebar">
      <div class="side-actions">
        <button id="newCategoryBtn">카테고리 생성</button>
        <button id="newDocumentBtn">문서 생성</button>
      </div>
      <div id="tree" class="tree"><div class="loading">불러오는 중…</div></div>
    </aside>

    <main class="main">
      <div id="status" class="status hidden"></div>
      <section id="viewPage" class="page"></section>
      <section id="editPage" class="page hidden"></section>
    </main>
  </div>
</div>

<div id="imageOverlay" class="image-overlay hidden"><i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i><i data-h="e"></i><i data-h="se"></i><i data-h="s"></i><i data-h="sw"></i><i data-h="w"></i></div>
<div id="modalBackdrop" class="modal-backdrop hidden"><div id="modal" class="modal"></div></div>
<script src="editor.js"></script>
</body>
</html>
